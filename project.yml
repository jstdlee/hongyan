# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate && open Hongyan.xcodeproj
# CI (.github/workflows/ci.yml) generates and builds it the same way.
#
# Change these before the first build:
#   HONGYAN_BUNDLE_ID        your reverse-DNS bundle id (App Group / Keychain ids derive from it)
#   HONGYAN_UPLOAD_URL_BASE  the S3 endpoint the upload extension may talk to. Apple requires
#                            it in the extension's Info.plist, so it is fixed per build.
#                            R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
#                            AWS: https://s3.<region>.amazonaws.com (path-style)
#   DEVELOPMENT_TEAM         your Apple team id
name: Hongyan
options:
  bundleIdPrefix: com.jstdlee
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    HONGYAN_BUNDLE_ID: com.jstdlee.hongyan
    HONGYAN_UPLOAD_URL_BASE: https://ACCOUNT_ID.r2.cloudflarestorage.com
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  HongyanCore:
    path: HongyanCore

targets:
  Hongyan:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - iOS/Shared
    dependencies:
      - package: HongyanCore
      - target: HongyanUpload
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HONGYAN_BUNDLE_ID)
        INFOPLIST_KEY_CFBundleDisplayName: Hongyan
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Hongyan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, ja, ko]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Hongyan backs up your photos and videos to your own S3-compatible storage.
        UIBackgroundModes: [fetch, audio, location]
        NSLocationWhenInUseUsageDescription: Hongyan can use coarse location to stay awake during a backup, if you turn this on in Settings. Your location is not stored or uploaded.
        BGTaskSchedulerPermittedIdentifiers: [$(HONGYAN_BUNDLE_ID).refresh]
        HongyanRefreshTaskID: $(HONGYAN_BUNDLE_ID).refresh
        HongyanAppGroup: group.$(HONGYAN_BUNDLE_ID)
        HongyanKeychainGroup: $(AppIdentifierPrefix)$(HONGYAN_BUNDLE_ID).shared
        BackgroundUploadURLBase: $(HONGYAN_UPLOAD_URL_BASE)
    entitlements:
      path: iOS/App/Hongyan.entitlements
      properties:
        com.apple.security.application-groups: [group.$(HONGYAN_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(HONGYAN_BUNDLE_ID).shared]

  # PhotoKit Background Resource Upload extension (ExtensionKit, iOS 26.1+).
  # If your XcodeGen version can't embed ExtensionKit extensions, create the
  # target in Xcode instead: File > New > Target > Generic Extension, then add
  # the files below and the Info.plist keys listed here.
  HongyanUpload:
    type: extensionkit-extension
    platform: iOS
    sources:
      - iOS/UploadExtension
      - iOS/Shared
    dependencies:
      - package: HongyanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HONGYAN_BUNDLE_ID).upload
    info:
      path: iOS/UploadExtension/Info.plist
      properties:
        CFBundleDisplayName: Hongyan Upload
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.photos.background-upload
        BackgroundUploadURLBase: $(HONGYAN_UPLOAD_URL_BASE)
        HongyanRefreshTaskID: $(HONGYAN_BUNDLE_ID).refresh
        HongyanAppGroup: group.$(HONGYAN_BUNDLE_ID)
        HongyanKeychainGroup: $(AppIdentifierPrefix)$(HONGYAN_BUNDLE_ID).shared
    entitlements:
      path: iOS/UploadExtension/HongyanUpload.entitlements
      properties:
        com.apple.security.application-groups: [group.$(HONGYAN_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(HONGYAN_BUNDLE_ID).shared]

schemes:
  Hongyan:
    build:
      targets:
        Hongyan: all
        HongyanUpload: all
